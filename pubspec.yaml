name: ym_easy_pdf_viewer
description: A Flutter PDF viewer plugin with asset, file, URL, paging, zoom, and download progress support for Android and iOS.
version: 1.0.0
homepage: https://github.com/yashmanghnani/ym_easy_pdf_viewer
repository: https://github.com/yashmanghnani/ym_easy_pdf_viewer
issue_tracker: https://github.com/yashmanghnani/ym_easy_pdf_viewer/issues

environment:
  sdk: ">=3.13.2 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  numberpicker: ^2.1.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  uses-material-design: true
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: dev.kaichi.easy_pdf_viewer
        pluginClass: EasyPdfViewerPlugin
      ios:
        pluginClass: EasyPdfViewerPlugin
