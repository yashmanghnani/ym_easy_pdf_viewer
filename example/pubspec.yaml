name: easy_pdf_viewer_example
description: Demonstrates how to use the easy_pdf_viewer plugin.
version: 1.0.0+1

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter

  ym_easy_pdf_viewer:
    path: ../

  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:

  uses-material-design: true
  assets:
    - assets/sample.pdf
    - assets/sample2.pdf
